name: Build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (host, tests on)
        run: cmake -B build/host -DMINESWEEPER_BACKEND=none -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/host --config Release

      - name: Run tests
        run: ctest --test-dir build/host --output-on-failure

  kobo-cross-build:
    name: Kobo device build (armhf)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest koxtoolchain release tag
        id: koxtc
        run: |
          tag=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/koreader/koxtoolchain/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # koxtoolchain publishes a prebuilt cross-compiler for Kobo (arm-kobo-linux-gnueabihf)
      # as a release asset, so CI can skip the ~30 min crosstool-ng build (gen-tc.sh) entirely.
      # https://github.com/koreader/koxtoolchain/releases
      - name: Cache koxtoolchain (kobo)
        id: cache-koxtc
        uses: actions/cache@v4
        with:
          path: ~/x-tools/arm-kobo-linux-gnueabihf
          key: koxtoolchain-kobo-${{ steps.koxtc.outputs.tag }}

      # The release tarball's own top-level directory is "x-tools/", so it
      # must be unpacked into $HOME (not $HOME/x-tools) to land at the
      # expected $HOME/x-tools/arm-kobo-linux-gnueabihf. Asset format is
      # .tar.zst (Zstandard), not .tar.gz -- koxtoolchain switched formats
      # upstream; ubuntu-latest's GNU tar supports --zstd natively.
      - name: Download & unpack koxtoolchain (kobo)
        if: steps.cache-koxtc.outputs.cache-hit != 'true'
        run: |
          curl -L -o kobo.tar.zst \
            "https://github.com/koreader/koxtoolchain/releases/download/${{ steps.koxtc.outputs.tag }}/kobo.tar.zst"
          tar --zstd -xf kobo.tar.zst -C "$HOME"

      - name: Build FBInk (static, cross)
        run: tools/build-fbink.sh

      - name: Configure (device, fbink backend)
        run: cmake -B build/kobo -DCMAKE_TOOLCHAIN_FILE=cmake/kobo-toolchain.cmake -DMINESWEEPER_BACKEND=fbink

      - name: Build device binary
        run: cmake --build build/kobo

      - name: Ensure zip is available
        run: command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Package device zip
        run: tools/package.sh build/kobo

      - name: Upload device package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobo-app-zip
          path: dist/minesweeper.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: kobo-cross-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kobo-app-zip
          path: dist

      - name: Create release with device zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/minesweeper.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Minesweeper $GITHUB_REF_NAME" \
            --generate-notes
